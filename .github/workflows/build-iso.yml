name: Build ArctineOS ISO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - name: Check out repository where this action is defined
        uses: actions/checkout@v7

# This step was taken from github.com/apollo-linux/apollo
      - name: Free disk space
        uses: hastd/free-disk-space@68572aeaadb7f76bd408246328e95926323402b5 # v0.1.2
        with:
          exclude: |
            /opt/hostedtoolcache/Python
            skip-if-available: "64G"

      - name: Build ISO using the ArctineOS-bootc ISO Builder
        id: build
        uses: distrolabs/arctineos-bootc-iso-builder@main # Remember to pin by commit hash
        with:
          container-image: 'ghcr.io/arctinelabs/arctineos:latest'
          iso-path: './iso/archlinux.iso'

      - name: Upload disk images and Checksum to Job Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ArctineOS-ISO
          path: ./iso/
          if-no-files-found: error
          retention-days: 0
          compression-level: 0
          overwrite: true
